<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Catálogo | Catálogo Micológico</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navegacion.css">
    <link rel="stylesheet" href="../css/catalogo.css">
</head>

<body>

<header class="site-header">

    <div class="container nav-container">

        <a href="../index.html" class="logo">
            Catálogo Micológico
        </a>

        <nav class="main-nav">

            <a
                href="../index.html"
                data-nav
            >
                Inicio
            </a>

            <a
                href="catalogo.html"
                data-nav
            >
                Catálogo
            </a>

            <a
                href="login.html"
                data-nav
                data-auth-link
                data-auth-label="true"
            >
                Investigadores
            </a>

        </nav>

    </div>

</header>


<main>

    <section class="page-header">

        <div class="container">

            <p class="eyebrow">
                Especies registradas
            </p>

            <h1>
                Catálogo de hongos
            </h1>

            <p>
                Consulta las especies aprobadas disponibles
                en el catálogo micológico.
            </p>

        </div>

    </section>


    <section class="section">

        <div class="container">

            <div class="catalog-search">

                <label for="buscador-catalogo">
                    Buscar especie
                </label>

                <input
                    type="search"
                    id="buscador-catalogo"
                    placeholder="Nombre, familia o género..."
                    autocomplete="off"
                >

            </div>


            <div
                id="catalogo-hongos"
                class="fungi-grid"
            >

                <p class="catalog-message">
                    Cargando catálogo...
                </p>

            </div>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="container">

        <p>
            © <span data-year></span> Catálogo Micológico
        </p>

    </div>

</footer>


<script
    type="module"
    src="../js/app.js"
></script>

<script
    type="module"
    src="../js/especies/catalogo.js"
></script>

</body>
</html>
